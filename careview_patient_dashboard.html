<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareView — Clinical Patient Dashboard</title>
<style>
:root{--ink:#20372f;--muted:#788980;--line:#e4ebe5;--paper:#f5f8f5;--green:#168e60;--nav:#183c32}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{max-width:1100px;margin:24px auto;background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:0 8px 35px #20372f12;min-height:700px}
.head{background:var(--nav);color:white;padding:18px 20px 0}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:16px}
.logo{font-size:19px;font-weight:800}.logo em{color:#8bd3a2;font-style:normal}
.person{display:flex;align-items:center;gap:9px;font-size:12px}
.avatar{background:#d9ead4;color:#24513a;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.person small{display:block;color:#b8ccc1;font-size:10px}
.tabs{display:flex;overflow-x:auto;gap:4px}
.tab{border:0;border-bottom:3px solid transparent;background:none;color:#bdcec5;padding:12px 11px;font-size:12px;white-space:nowrap}
.tab.active{color:white;border-color:#8bd3a2;font-weight:750}
.main{padding:21px;max-width:1050px;margin:auto}
.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px;flex-wrap:wrap}
h2{font-size:21px;letter-spacing:-.7px;margin:0 0 4px}h3{font-size:14px;margin:0}
.muted{color:var(--muted)}.tiny{font-size:10px}
.pill{display:inline-block;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:700}
.green{background:#e0f1e3;color:#28734d}.red{background:#ffebea;color:#bd444b}.gray{background:#edf1ed;color:#66756c}
.arrows{display:flex;gap:7px}.circle{width:32px;height:32px;border-radius:50%;background:white;border:1px solid #e1e9e2;color:#234337;font-size:17px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;gap:10px}
.carousel{overflow:hidden;padding:3px 0 9px}.track{display:flex;gap:12px;transition:transform .25s ease}
.metric{flex:0 0 78%;max-width:290px;min-height:202px;border-radius:16px;padding:17px;display:flex;flex-direction:column;justify-content:space-between}
.metric.good{background:#d6e9cd}.metric.bad{background:#ffdddd}
.metric .type{text-transform:uppercase;font-size:10px;letter-spacing:1px;font-weight:750;opacity:.7}
.metric .name{font-size:17px;font-weight:750;margin-top:7px}
.metric .value{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:8px}
.metric .unit{font-size:12px;font-weight:500;letter-spacing:0}
.metric .detail{font-size:11px;opacity:.75;margin-top:4px}
.metric .foot{display:flex;justify-content:space-between;gap:5px;font-size:10px;font-weight:700}
.good .foot{color:#27734c}.bad .foot{color:#b83e48}
.dots{display:flex;justify-content:center;gap:5px;margin-bottom:22px}
.dot{width:7px;height:7px;border:0;border-radius:10px;background:#cbd6ce;padding:0}
.dot.active{width:19px;background:#168e60}
.category{background:white;border-top:1px solid var(--line)}.category:last-child{border-bottom:1px solid var(--line)}
.catbutton{width:100%;padding:15px 12px;background:white;border:0;color:#243a31;display:flex;justify-content:space-between;text-align:left;align-items:center;font-size:12px;font-weight:700}
.catbutton span:first-child{display:flex;gap:10px;align-items:center}
.arrow{color:#829188;transition:transform .2s}.category.open .arrow{transform:rotate(180deg)}
.catbody{display:none;padding:0 12px 12px}.category.open .catbody{display:block}
.metricrow{padding:11px 8px;border-top:1px solid #edf1ed;display:flex;justify-content:space-between;align-items:center;gap:8px}
.metricrow strong{font-size:12px}.metricrow .right{text-align:right;font-size:12px;font-weight:750}
.panel{background:white;border:1px solid #e3eae4;border-radius:12px;padding:16px;margin-bottom:13px}
.panel h3{margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#f4f7f3;border-radius:9px;padding:12px}.stat strong{display:block;font-size:21px;margin-top:5px}
.field{margin:12px 0}label{display:block;font-size:11px;font-weight:700;margin-bottom:6px}
input[type=text],textarea{width:100%;border:1px solid #dfe7e0;border-radius:8px;padding:10px;background:white;color:#20372f}
textarea{min-height:75px;resize:vertical}
.btn{background:white;border:1px solid #dce6dd;border-radius:8px;padding:9px 13px;font-size:11px;font-weight:700;color:#20372f}
.primary{background:#183c32;color:white;border-color:#183c32}
.setting{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf1ed}
.setting input{width:18px;height:18px;accent-color:#168e60}
.message{padding:12px;background:#f1f5f1;border-radius:10px;margin:9px 0;max-width:90%;font-size:12px}
.message.mine{margin-left:auto;background:#e2f0e4}
.footer{padding:0 20px 20px;color:#87948b;font-size:10px;line-height:1.5}
@media(min-width:650px){.main{padding:26px 30px}.metric{flex-basis:31%;max-width:none}}
@media(max-width:500px){.app{margin:0;border-radius:0}.main{padding:14px}.metric{flex-basis:88%}.stats{grid-template-columns:1fr 1fr}.brand{align-items:flex-start}}
</style>
</head>
<body>
<div class="app" id="careview-app">
  <header class="head">
    <div class="brand">
      <div class="logo">Care<em>View</em> <span style="font-size:9px;color:#b9cec2;font-weight:500">CLINICAL</span></div>
      <div class="person"><div class="avatar">JD</div><div><b>Jordan Davis</b><small>Demo patient · ID 004821</small></div></div>
    </div>
    <nav class="tabs" aria-label="Dashboard navigation">
      <button class="tab active" data-page="overview">Overview</button>
      <button class="tab" data-page="messages">Messages</button>
      <button class="tab" data-page="notes">Notes</button>
      <button class="tab" data-page="all">All Metrics</button>
      <button class="tab" data-page="settings">Settings</button>
    </nav>
  </header>
  <main class="main" id="cv-content"></main>
  <div class="footer">CareView prototype · All patient information is fictional. Red indicators are illustrative review flags, not medical diagnoses or validated clinical alerts.</div>
</div>
<script>
(() => {
  const app = document.getElementById('careview-app');
  const out = document.getElementById('cv-content');
  if (!app || !out) return;

  const data = [
    {id:'bp',name:'Blood Pressure',cat:'Vitals',v:'118/76',u:'mmHg',good:true,detail:'Within configured range',time:'Today, 9:15 AM',fav:true},
    {id:'hr',name:'Resting Heart Rate',cat:'Vitals',v:'72',u:'bpm',good:true,detail:'Consistent with recent readings',time:'Today, 9:15 AM',fav:true},
    {id:'o2',name:'Oxygen Saturation',cat:'Vitals',v:'97',u:'%',good:true,detail:'Within configured range',time:'Today, 9:15 AM',fav:true},
    {id:'glucose',name:'Blood Glucose',cat:'Metabolic',v:'168',u:'mg/dL',good:false,detail:'Above illustrative target',time:'Today, 8:30 AM',fav:true},
    {id:'sleep',name:'Sleep Duration',cat:'Lifestyle',v:'4.2',u:'hrs',good:false,detail:'Below recent average',time:'Last night',fav:true},
    {id:'temp',name:'Body Temperature',cat:'Vitals',v:'98.6',u:'°F',good:true,detail:'Within configured range',time:'Today',fav:false},
    {id:'weight',name:'Weight',cat:'Vitals',v:'164',u:'lbs',good:true,detail:'Stable over 30 days',time:'Yesterday',fav:false},
    {id:'ldl',name:'LDL Cholesterol',cat:'Lab Results',v:'132',u:'mg/dL',good:false,detail:'Review clinical goals',time:'Oct 30',fav:false},
    {id:'hdl',name:'HDL Cholesterol',cat:'Lab Results',v:'54',u:'mg/dL',good:true,detail:'Latest laboratory result',time:'Oct 30',fav:false},
    {id:'a1c',name:'HbA1c',cat:'Lab Results',v:'6.1',u:'%',good:false,detail:'Requires clinical interpretation',time:'Oct 30',fav:false},
    {id:'steps',name:'Daily Steps',cat:'Lifestyle',v:'6,420',u:'steps',good:true,detail:'Daily activity measurement',time:'Yesterday',fav:false},
    {id:'activity',name:'Active Minutes',cat:'Lifestyle',v:'38',u:'min',good:true,detail:'Daily activity measurement',time:'Yesterday',fav:false},
    {id:'meds',name:'Medication Adherence',cat:'Medications',v:'92',u:'%',good:true,detail:'Patient-reported adherence',time:'This week',fav:false},
    {id:'resp',name:'Respiratory Rate',cat:'Vitals',v:'16',u:'breaths/min',good:true,detail:'Within configured range',time:'Today',fav:false}
  ];
  const categories = ['Vitals','Lab Results','Metabolic','Lifestyle','Medications'];
  let page = 'overview', index = 0;
  let messages = [
    {mine:false,time:'Yesterday · 4:20 PM',text:'I have been having trouble keeping a consistent sleep schedule.'},
    {mine:true,time:'Yesterday · 4:45 PM',text:'Thanks for letting me know. We can discuss this at your next check-in.'}
  ];
  let notes = [
    {title:'Routine follow-up',date:'Nov 5, 2026 · 9:30 AM',body:'Patient reports feeling generally well. Review recent sleep and glucose trends at next visit.'}
  ];

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const heading = (title,sub,action='') => `<div class="heading"><div><h2>${title}</h2><div class="muted tiny">${sub}</div></div>${action}</div>`;
  const card = m => `<article class="metric ${m.good?'good':'bad'}"><div><div class="type">${esc(m.cat)}</div><div class="name">${esc(m.name)}</div><div class="value">${esc(m.v)} <span class="unit">${esc(m.u)}</span></div><div class="detail">${esc(m.detail)}</div></div><div class="foot"><span>${m.good?'● In range':'● Needs review'}</span><span>${esc(m.time)}</span></div></article>`;
  const row = m => `<div class="metricrow"><div><strong>${esc(m.name)}</strong><div class="muted tiny">${esc(m.detail)}</div></div><div class="right">${esc(m.v)} ${esc(m.u)}<div><span class="pill ${m.good?'green':'red'}">${m.good?'Normal':'Review'}</span></div></div></div>`;

  function renderOverview() {
    const featured = data.filter(m => m.fav);
    if (index >= featured.length) index = 0;
    let html = heading('Patient overview','A snapshot of health trends and priority measurements','<span class="pill green">● Demo data</span>');
    html += `<div class="sectionhead"><div><h3>Priority health metrics</h3><div class="muted tiny">Doctor-selected and unusual readings</div></div><div class="arrows"><button class="circle" data-act="prev" aria-label="Previous metric">‹</button><button class="circle" data-act="next" aria-label="Next metric">›</button></div></div>`;
    html += `<div class="carousel"><div class="track" id="cv-track">${featured.map(card).join('')}</div></div>`;
    html += `<div class="dots">${featured.map((m,i)=>`<button class="dot ${i===index?'active':''}" data-index="${i}" aria-label="Show metric ${i+1}"></button>`).join('')}</div>`;
    html += `<div class="sectionhead"><div><h3>Health data categories</h3><div class="muted tiny">Expand a category to view individual measurements</div></div><span class="pill gray">${data.length} metrics</span></div>`;
    categories.forEach((c,i) => {
      const items = data.filter(m => m.cat === c);
      html += `<section class="category ${i===0?'open':''}"><button class="catbutton" data-cat="${esc(c)}"><span><span class="arrow">⌄</span>${esc(c)} <span class="pill gray">${items.length}</span></span><span class="muted tiny">${items.filter(m=>!m.good).length} flagged</span></button><div class="catbody">${items.map(row).join('')}</div></section>`;
    });
    out.innerHTML = html;
    const track = document.getElementById('cv-track');
    const firstCard = track.querySelector('.metric');
    if (firstCard) track.style.transform = `translateX(-${index*(firstCard.getBoundingClientRect().width+12)}px)`;
  }

  function renderAll() {
    let html = heading('All health metrics','Browse all measurements in the patient record');
    html += `<div class="panel"><label for="cv-search">Search metrics</label><input type="text" id="cv-search" placeholder="Search by name or category..."><div class="stats" style="margin-top:13px"><div class="stat"><span class="tiny muted">Total metrics</span><strong>${data.length}</strong></div><div class="stat"><span class="tiny muted">Normal</span><strong>${data.filter(m=>m.good).length}</strong></div><div class="stat"><span class="tiny muted">Review</span><strong>${data.filter(m=>!m.good).length}</strong></div></div></div><div class="panel" id="cv-results">${data.map(row).join('')}</div>`;
    out.innerHTML = html;
    document.getElementById('cv-search').addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      document.getElementById('cv-results').innerHTML = data.filter(m => (m.name+' '+m.cat).toLowerCase().includes(q)).map(row).join('') || '<p class="muted">No metrics found.</p>';
    });
  }

  function renderMessages() {
    let html = heading('Messages','Patient communication and conversation history');
    html += `<div class="panel"><h3>Jordan Davis</h3><div class="muted tiny">Secure communication · Demo only</div>${messages.map(m=>`<div class="message ${m.mine?'mine':''}"><div class="muted tiny">${m.mine?'You':'Jordan Davis'} · ${esc(m.time)}</div><div style="margin-top:5px">${esc(m.text)}</div></div>`).join('')}<div class="field"><label for="cv-message">New message</label><textarea id="cv-message" placeholder="Write a message..."></textarea></div><button class="btn primary" data-act="send">Send message</button></div>`;
    out.innerHTML = html;
  }

  function renderNotes() {
    let html = heading('Clinical notes','Review and document patient encounters');
    html += `<div class="panel"><h3>Add a clinical note</h3><div class="field"><label for="cv-title">Note title</label><input type="text" id="cv-title" placeholder="Follow-up consultation"></div><div class="field"><label for="cv-note">Clinical note</label><textarea id="cv-note" placeholder="Enter observations and plan..."></textarea></div><button class="btn primary" data-act="note">Save note</button></div>`;
    notes.forEach(n => html += `<div class="panel"><div class="muted tiny">${esc(n.date)}</div><h3 style="margin:8px 0">${esc(n.title)}</h3><p>${esc(n.body)}</p></div>`);
    out.innerHTML = html;
  }

  function renderSettings() {
    let html = heading('Dashboard settings','Choose which metrics appear on the overview carousel');
    html += '<div class="panel"><h3>Featured metrics</h3><p class="muted tiny">Select the measurements you want to see on the front page. Readings marked for review appear in red.</p>';
    data.forEach(m => html += `<div class="setting"><label for="fav-${m.id}">${esc(m.name)}<div class="muted tiny">${esc(m.cat)} · ${m.good?'Normal':'Review'}</div></label><input type="checkbox" id="fav-${m.id}" data-fav="${m.id}" ${m.fav?'checked':''}></div>`);
    html += `<button class="btn primary" style="margin-top:15px" data-act="save">Save preferences</button></div><div class="panel"><h3>Display options</h3><div class="setting"><span>Show metric status labels</span><input type="checkbox" checked disabled></div><div class="setting"><span>Highlight review readings</span><input type="checkbox" checked disabled></div><p class="muted tiny">Clinical thresholds and permissions would be configured in a production version.</p></div>`;
    out.innerHTML = html;
  }

  function render() {
    app.querySelectorAll('.tab').forEach(b => b.classList.toggle('active',b.dataset.page===page));
    if(page==='overview') renderOverview();
    else if(page==='all') renderAll();
    else if(page==='messages') renderMessages();
    else if(page==='notes') renderNotes();
    else if(page==='settings') renderSettings();
  }

  app.addEventListener('click', e => {
    const tab = e.target.closest('[data-page]');
    if(tab){page=tab.dataset.page;render();return;}
    const category = e.target.closest('[data-cat]');
    if(category){category.parentElement.classList.toggle('open');return;}
    const dot = e.target.closest('[data-index]');
    if(dot){index=Number(dot.dataset.index);renderOverview();return;}
    const action = e.target.closest('[data-act]');
    if(!action)return;
    if(action.dataset.act==='prev'||action.dataset.act==='next'){
      const count=data.filter(m=>m.fav).length;
      if(!count)return;
      index=(index+(action.dataset.act==='next'?1:-1)+count)%count;
      renderOverview();
    } else if(action.dataset.act==='send'){
      const field=document.getElementById('cv-message');
      if(!field.value.trim())return;
      messages.push({mine:true,time:'Just now',text:field.value.trim()});
      renderMessages();
    } else if(action.dataset.act==='note'){
      const title=document.getElementById('cv-title').value.trim();
      const body=document.getElementById('cv-note').value.trim();
      if(!title||!body){alert('Please enter both a title and a note.');return;}
      notes.unshift({title,body,date:'Just now'});
      renderNotes();
    } else if(action.dataset.act==='save'){
      app.querySelectorAll('[data-fav]').forEach(el=>{
        const metric=data.find(m=>m.id===el.dataset.fav);
        if(metric)metric.fav=el.checked;
      });
      index=0;
      renderOverview();
    }
  });

  render();
})();
</script>
</body>
</html>
